00}\np{margin:0}\nbutton,select,input,textarea{font:inherit;color:inherit}\nbutton{cursor:pointer}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px}\n.pad{padding:16px}\n.sub{color:var(--mute);font-size:13px}\n.mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px}\n.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 14px;min-height:40px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}\n.btn:hover{background:var(--soft)}\n.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}\n.btn.pri:hover{background:#0b5f58}\n.btn.dng{background:#b91c1c;border-color:#b91c1c;color:#fff}\n.btn:disabled{opacity:.45;cursor:not-allowed}\n.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}\n.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid transparent;white-space:nowrap}\n.b-high{background:#fee2e2;color:#7f1d1d;border-color:#fca5a5}\n.b-pot{background:#ffedd5;color:#7c2d12;border-color:#fdba74}\n.b-rev{background:#fef3c7;color:#713f12;border-color:#fcd34d}\n.b-low{background:#f1f5f9;color:#334155;border-color:#cbd5e1}\n.c-ok{background:#dcfce7;color:#14532d;border-color:#86efac}\n.c-warn{background:#fef3c7;color:#713f12;border-color:#fcd34d}\n.c-bad{background:#fee2e2;color:#7f1d1d;border-color:#fca5a5}\n.c-mute{background:#f1f5f9;color:#475569;border-color:#cbd5e1}\n.c-info{background:#e0f2fe;color:#0c4a6e;border-color:#7dd3fc}\n.c-ai{background:#e0e7ff;color:#312e81;border-color:#a5b4fc}\n.c-an{background:#d1fae5;color:#064e3b;border-color:#6ee7b7}\n.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}\n.brand{font-weight:600;font-size:15px}\n.grow{flex:1 1 auto}\n.sel{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 10px;min-height:38px}\n.meter{display:flex;flex-direction:column;gap:4px;min-width:190px}\n.bar{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden}\n.fill{height:100%;border-radius:99px}\n.f-ok{background:#0f766e}.f-warn{background:#b45309}.f-stop{background:#b91c1c}\n.body{display:flex;flex-wrap:wrap;align-items:flex-start;flex:1 1 auto}\n.nav{flex:0 0 210px;padding:16px 12px;display:flex;flex-direction:column;gap:4px}\n.navbtn{text-align:left;border:0;background:transparent;border-radius:8px;padding:10px 12px;font-weight:500;color:#334155}\n.navbtn:hover{background:#e8ecf1}\n.navbtn.on{background:#fff;color:var(--acc);box-shadow:0 0 0 1px var(--line)}\n.main{flex:999 1 560px;min-width:0;padding:20px;display:flex;flex-direction:column;gap:16px}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}\n.stat .n{font-size:26px;font-weight:600}\n.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.search{border:1px solid #cbd5e1;border-radius:8px;padding:6px 10px;min-height:38px;background:#fff}\n.scroll{overflow-x:auto}\n.grid{display:grid;grid-template-columns:1.2fr 1.6fr 1fr .5fr 1.3fr .9fr 1.2fr .9fr;gap:10px;align-items:center;padding:10px 16px;min-width:980px}\n.grid.h{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}\n.grid.r{border-bottom:1px solid var(--line)}\n.grid.r:last-child{border-bottom:0}\n.agrid{display:grid;grid-template-columns:1.3fr 1.1fr 1.2fr 1.2fr 1.4fr 1.5fr 1.1fr .9fr 1fr 1.8fr 1.1fr .7fr 1.4fr;gap:12px;align-items:start;padding:10px 16px;min-width:2100px}\n.agrid.h{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}\n.agrid.r{border-bottom:1px solid var(--line)}\n.agrid.r:last-child{border-bottom:0}\n.link{border:0;background:transparent;color:var(--acc);font-weight:600;padding:0;text-align:left;text-decoration:underline;min-height:32px}\n.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}\n.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}\n.tabb{border:0;background:transparent;padding:10px 14px;font-weight:500;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}\n.tabb.on{color:var(--acc);border-bottom-color:var(--acc)}\n.tab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;min-height:36px}\n.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}\n.rowf{display:grid;grid-template-columns:1.1fr 1.4fr 1.4fr .9fr 1.2fr;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:center;min-width:640px}\n.rowf.h{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.4px}\n.rowf:last-child{border-bottom:0}\n.tbl{display:grid;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:center}\n.tbl:last-child{border-bottom:0}\n.tbl.h{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.4px}\n.pill{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 14px;min-height:40px;font-weight:500}\n.pill.on{background:#064e3b;color:#fff;border-color:#064e3b}\n.pill:disabled{opacity:.45;cursor:not-allowed}\n.banner{border-radius:10px;padding:12px 16px;border:1px solid}\n.warnb{background:#fef3c7;border-color:#fcd34d;color:#713f12}\n.badb{background:#fee2e2;border-color:#fca5a5;color:#7f1d1d}\n.okb{background:#dcfce7;border-color:#86efac;color:#14532d}\n.infob{background:#e0f2fe;border-color:#7dd3fc;color:#0c4a6e}\n.aicard{background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px}\n.ancard{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px}\n.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;padding:5px 0;border-bottom:1px solid var(--line)}\n.kv:last-child{border-bottom:0}\n.ta{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;min-height:76px;background:#fff;resize:vertical}\n.row2{display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr .6fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}\n.row2:last-child{border-bottom:0}\ninput[type=range]{width:100%;accent-color:#0f766e;min-height:28px}\n.pre{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:12px 14px;overflow:auto;white-space:pre;margin:0;max-height:420px}\n.steps{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}\n.steps li{display:flex;gap:10px;align-items:flex-start}\n.dot{flex:0 0 24px;height:24px;border-radius:99px;background:#dcfce7;color:#14532d;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:1px solid #86efac}\n.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto}\n.modal{background:#fff;border-radius:12px;width:100%;max-width:760px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}\n.toast{position:fixed;right:20px;bottom:20px;z-index:60;max-width:380px;padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2)}\n.spin{width:26px;height:26px;border-radius:50%;border:3px solid #cbd5e1;border-top-color:var(--acc);animation:sp 0.8s linear infinite}\n@keyframes sp{to{transform:rotate(360deg)}}\n.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}\n.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding:8px 4px 0}\n.barcol{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}\n.stack{width:100%;max-width:34px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:4px 4px 0 0;overflow:hidden}\n.err{color:#b91c1c;font-size:13px}\n.fld{display:flex;flex-direction:column;gap:4px}\n.fld label{font-size:12px;color:var(--mute);font-weight:600}\n.check{display:flex;gap:8px;align-items:center;min-height:32px}\n.check input{width:18px;height:18px;accent-color:#0f766e}\n.dock{position:sticky;bottom:0;z-index:5}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; display: flex; flex-direction: column\" data-canvas-width=\"1360\" data-canvas-height=\"900\" data-document-role=\"page\" data-label=\"Country console, Cambodia (clickable)\">\n\n  <!-- ================= LOGIN: start ================= -->\n  <sc-if value=\"{{lg.isOut}}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"center\">\n      <div class=\"card pad\" style=\"max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 14px\">\n        <span class=\"brand\">Screening console<\u002Fspan>\n        <h1>Sign in<\u002Fh1>\n        <p class=\"sub\">{{ui.cname}} deployment. Access is managed by your organisation's SSO. You will be redirected to sign in and brought back here.<\u002Fp>\n        <button class=\"btn pri\" sc-camel-on-click=\"{{lg.start}}\">Sign in with SSO (Okta)<\u002Fbutton>\n        <p class=\"sub\">Prototype: the SSO pages are mocked. No real authentication happens.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{lg.isRedirect}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"center\">\n      <div class=\"card pad\" style=\"max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center\">\n        <div class=\"spin\" role=\"status\" aria-label=\"Loading\"><\u002Fdiv>\n        <h2>{{lg.redirectText}}<\u002Fh2>\n        <p class=\"sub\">{{lg.redirectSub}}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{lg.isChooser}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"center\">\n      <div class=\"card pad\" style=\"max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 10px\">\n        <span class=\"chip c-mute\">Mock SSO page (Okta)<\u002Fspan>\n        <h1>Choose an account<\u002Fh1>\n        <p class=\"sub\">In the real flow this is your organisation's sign-in. Pick a mock user to see that role.<\u002Fp>\n        <sc-if value=\"{{lg.error}}\"><div class=\"banner badb\">{{lg.error}}<\u002Fdiv><\u002Fsc-if>\n        <sc-for list=\"{{lg.accounts}}\" as=\"u\" hint-placeholder-count=\"5\">\n          <button class=\"btn\" style=\"justify-content: space-between; text-align: left; gap: 12px\" sc-camel-on-click=\"{{u.pick}}\">\n            <span><b>{{u.name}}<\u002Fb><br><span class=\"sub\">{{u.email}}<\u002Fspan><\u002Fspan>\n            <span class=\"chip {{u.cls}}\">{{u.role}}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <!-- ================= LOGIN: end ================= -->\n\n  <sc-if value=\"{{ui.isPlatform}}\" hint-placeholder-val=\"{{ false }}\">\n    <dc-import name=\"Onboarding\" on-back=\"{{ui.leavePlatform}}\" on-open=\"{{ui.openCountry}}\" hint-size=\"100%,900px\"><\u002Fdc-import>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ui.inApp}}\" hint-placeholder-val=\"{{ false }}\">\n    <header class=\"top\">\n      <span class=\"brand\">Screening console<\u002Fspan>\n      <span class=\"chip c-ok\">{{ui.cname}} · {{ui.cstatus}}<\u002Fspan>\n      <span class=\"chip c-mute\">Prototype · sample data<\u002Fspan>\n      <span class=\"grow\"><\u002Fspan>\n      <sc-if value=\"{{ui.showMeter}}\">\n        <div class=\"meter\" aria-label=\"AI token quota\">\n          <div style=\"display: flex; justify-content: space-between; gap: 8px; font-size: 12px\"><span>{{ui.meter.label}}<\u002Fspan><span class=\"sub\">{{ui.meter.left}}<\u002Fspan><\u002Fdiv>\n          <div class=\"bar\"><div class=\"fill {{ui.meter.cls}}\" style=\"width: {{ui.meter.w}}\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <span style=\"text-align: right\"><b>{{ui.userName}}<\u002Fb><br><span class=\"chip {{ui.roleCls}}\">{{ui.roleLabel}}<\u002Fspan><\u002Fspan>\n      <button class=\"btn sm\" sc-camel-on-click=\"{{ui.signOut}}\">Sign out<\u002Fbutton>\n    <\u002Fheader>\n\n    <div class=\"body\">\n      <nav class=\"nav\" aria-label=\"Main\">\n        <sc-for list=\"{{ui.nav}}\" as=\"n\" hint-placeholder-count=\"6\">\n          <button class=\"navbtn {{n.cls}}\" sc-camel-on-click=\"{{n.go}}\">{{n.label}}<\u002Fbutton>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ui.showPlatform}}\">\n          <button class=\"btn sm\" style=\"margin-top: 14px\" sc-camel-on-click=\"{{ui.goPlatform}}\">Platform: onboard a country<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fnav>\n\n      <main class=\"main\">\n\n        <!-- ================= HOME ================= -->\n        <sc-if value=\"{{ui.showAwaiting}}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"banner infob\" style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n            <div style=\"flex: 1 1 360px\"><b>Awaiting first file.<\u002Fb> {{ui.cname}} was provisioned from the platform. No NICE file has arrived in its inbound container yet, so there are no alerts, no AI usage and no decisions.<\u002Fdiv>\n            <sc-if value=\"{{ui.canSim}}\"><button class=\"btn pri\" sc-camel-on-click=\"{{ui.simulate}}\" disabled=\"{{ui.simBusy}}\">Simulate first NICE file<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ui.cannotSim}}\"><span class=\"sub\">The Country Owner or Super Admin can load the first file.<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ui.simBusy}}\"><div class=\"spin\" role=\"status\" aria-label=\"Loading\"><\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ui.isHome}}\" hint-placeholder-val=\"{{ true }}\">\n          <div><h1>{{hm.title}}<\u002Fh1><p class=\"sub\">{{hm.sub}}<\u002Fp><\u002Fdiv>\n          <div class=\"stats\">\n            <sc-for list=\"{{hm.stats}}\" as=\"st\" hint-placeholder-count=\"4\">\n              <div class=\"card pad stat\"><div class=\"sub\">{{st.label}}<\u002Fdiv><div class=\"n\">{{st.value}}<\u002Fdiv><div class=\"sub\">{{st.note}}<\u002Fdiv><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div class=\"cols\">\n            <div class=\"card\" style=\"flex: 1 1 460px; min-width: 0\">\n              <div class=\"pad\"><h2>{{hm.listTitle}}<\u002Fh2><p class=\"sub\">{{hm.listSub}}<\u002Fp><\u002Fdiv>\n              <div class=\"scroll\">\n                <sc-if value=\"{{hm.listEmpty}}\"><div class=\"pad sub\">Nothing waiting. Good work.<\u002Fdiv><\u002Fsc-if>\n                <sc-for list=\"{{hm.list}}\" as=\"r\" hint-placeholder-count=\"4\">\n                  <div class=\"tbl\" style=\"grid-template-columns: 1.1fr 1.6fr .6fr 1fr; min-width: 520px\">\n                    <span><button class=\"link\" sc-camel-on-click=\"{{r.open}}\">{{r.id}}<\u002Fbutton><\u002Fspan><span>{{r.cust}}<\u002Fspan><span><b>{{r.score}}<\u002Fb><\u002Fspan><span><span class=\"chip {{r.statusCls}}\">{{r.status}}<\u002Fspan><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 16px; min-width: 0\">\n              <div class=\"card pad\">\n                <h2>What you can do<\u002Fh2>\n                <ul class=\"steps\" style=\"margin-top: 8px\">\n                  <sc-for list=\"{{hm.can}}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <li><span class=\"dot\">{{c.mark}}<\u002Fspan><span>{{c.t}}<\u002Fspan><\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fdiv>\n              <sc-if value=\"{{hm.showAttention}}\">\n                <div class=\"card pad\">\n                  <h2>Needs attention<\u002Fh2>\n                  <sc-for list=\"{{hm.attention}}\" as=\"a\" hint-placeholder-count=\"3\">\n                    <p style=\"margin-top: 8px\"><button class=\"link\" sc-camel-on-click=\"{{a.go}}\">{{a.t}}<\u002Fbutton><\u002Fp>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ================= ALERT LIST ================= -->\n        <sc-if value=\"{{ui.isAlerts}}\" hint-placeholder-val=\"{{ false }}\">\n          <div><h1>Alerts<\u002Fh1><p class=\"sub\">{{ui.cname}} · one row per alert. Each alert carries all of its watchlist hits and gets one decision. New files are picked up every 5 minutes.<\u002Fp><\u002Fdiv>\n          <div class=\"toolbar\">\n            <label class=\"sub\" for=\"fs\">Status<\u002Flabel>\n            <sc-raw-select id=\"fs\" class=\"sel\" value=\"{{al.fStatus}}\" sc-camel-on-change=\"{{al.onStatus}}\">\n              <option value=\"ALL\">All<\u002Foption><option value=\"New\">New<\u002Foption><option value=\"In review\">In review<\u002Foption><option value=\"Pending information\">Pending information<\u002Foption><option value=\"Closed\">Closed<\u002Foption><option value=\"Quarantined\">Quarantined<\u002Foption>\n            <\u002Fsc-raw-select>\n            <label class=\"sub\" for=\"fc\">Category<\u002Flabel>\n            <sc-raw-select id=\"fc\" class=\"sel\" value=\"{{al.fCat}}\" sc-camel-on-change=\"{{al.onCat}}\">\n              <option value=\"ALL\">All<\u002Foption><option value=\"SAN\">Sanctions<\u002Foption><option value=\"PEP\">PEP<\u002Foption><option value=\"SIP\">Special interest person<\u002Foption><option value=\"SIE\">Special interest entity<\u002Foption>\n            <\u002Fsc-raw-select>\n            <label class=\"sub\" for=\"fp\">Step<\u002Flabel>\n            <sc-raw-select id=\"fp\" class=\"sel\" value=\"{{al.fStep}}\" sc-camel-on-change=\"{{al.onStep}}\">\n              <option value=\"ALL\">All<\u002Foption><option value=\"L1 Review\">L1 Review<\u002Foption><option value=\"L2 Review\">L2 Review<\u002Foption><option value=\"L3 Review\">L3 Review<\u002Foption>\n            <\u002Fsc-raw-select>\n            <span class=\"grow\"><\u002Fspan>\n            <label class=\"sub\" for=\"qs\">Search<\u002Flabel>\n            <input id=\"qs\" class=\"search\" type=\"text\" placeholder=\"Alert, customer, party key\" value=\"{{al.q}}\" sc-camel-on-change=\"{{al.onSearch}}\">\n            <button class=\"btn sm\" sc-camel-on-click=\"{{al.clear}}\">Clear filters<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"card scroll\">\n            <div class=\"agrid h\"><span>Item date and time<\u002Fspan><span>Categories hit on<\u002Fspan><span>Status<\u002Fspan><span>List entry ID<\u002Fspan><span>Party key<\u002Fspan><span>IDs<\u002Fspan><span>Job name<\u002Fspan><span>Owner<\u002Fspan><span>Business unit<\u002Fspan><span>Hits highlights<\u002Fspan><span>Screening score<\u002Fspan><span>AI score<\u002Fspan><span>AI recommendation<\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{al.loading}}\"><div class=\"pad\" style=\"display: flex; gap: 12px; align-items: center\"><div class=\"spin\" role=\"status\" aria-label=\"Loading\"><\u002Fdiv><span class=\"sub\">Loading alerts<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{al.empty}}\">\n              <div class=\"pad\" style=\"min-width: 600px\"><p><b>{{al.emptyTitle}}<\u002Fb><\u002Fp><p class=\"sub\">{{al.emptySub}}<\u002Fp><\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-for list=\"{{al.rows}}\" as=\"r\" hint-placeholder-count=\"5\">\n              <div class=\"agrid r\">\n                <span><button class=\"link\" sc-camel-on-click=\"{{r.open}}\">{{r.id}}<\u002Fbutton><br><span class=\"sub\">{{r.at}}<\u002Fspan><\u002Fspan>\n                <span><sc-for list=\"{{r.cats}}\" as=\"c\" hint-placeholder-count=\"2\"><span class=\"chip c-mute\" style=\"margin: 0 4px 4px 0\">{{c}}<\u002Fspan><\u002Fsc-for><\u002Fspan>\n                <span><span class=\"chip {{r.statusCls}}\">{{r.status}}<\u002Fspan><br><span class=\"sub\">{{r.closed}}<\u002Fspan><\u002Fspan>\n                <span class=\"mono\">{{r.entry}}<\u002Fspan>\n                <span><b>{{r.pkey}}<\u002Fb><br>{{r.cust}}<br><span class=\"sub\">{{r.ctype}}<\u002Fspan><br>\n                  <sc-for list=\"{{r.flags}}\" as=\"f\" hint-placeholder-count=\"1\"><span class=\"chip {{f.cls}}\" style=\"margin-right: 4px\">{{f.t}}<\u002Fspan><\u002Fsc-for><\u002Fspan>\n                <span><span class=\"mono\">{{r.idMasked}}<\u002Fspan><br><span class=\"sub\">{{r.idSub}}<\u002Fspan><\u002Fspan>\n                <span class=\"mono\">{{r.job}}<\u002Fspan>\n                <span>{{r.owner}}<br><span class=\"sub\">{{r.step}}<\u002Fspan><\u002Fspan>\n                <span>{{r.bu}}<\u002Fspan>\n                <span><sc-for list=\"{{r.hl}}\" as=\"h\" hint-placeholder-count=\"3\"><span class=\"chip {{h.cls}}\" style=\"margin: 0 4px 4px 0\">{{h.t}}<\u002Fspan><\u002Fsc-for><br><span class=\"sub\">{{r.hits}} {{r.hitsWord}}<\u002Fspan><\u002Fspan>\n                <span><b>{{r.score}}<\u002Fb><br><span class=\"chip {{r.bandCls}}\">{{r.bandLabel}}<\u002Fspan><\u002Fspan>\n                <span><b>{{r.aiScore}}<\u002Fb><\u002Fspan>\n                <span><span class=\"chip {{r.aiCls}}\">{{r.aiRec}}<\u002Fspan><br><span class=\"sub\">{{r.aiConf}}<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ================= CASE ================= -->\n        <sc-if value=\"{{ui.isCase}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n            <button class=\"btn\" sc-camel-on-click=\"{{cs.back}}\">Back to alerts<\u002Fbutton>\n            <div>\n              <h1>{{cs.id}}<\u002Fh1>\n              <p class=\"sub\">{{cs.cust}} · {{cs.ctype}} · {{cs.pkey}} · received {{cs.at}}<\u002Fp>\n            <\u002Fdiv>\n            <span class=\"grow\"><\u002Fspan>\n            <span class=\"chip {{cs.bandCls}}\">{{cs.bandLabel}} · {{cs.score}}<\u002Fspan>\n            <span class=\"chip c-mute\">{{cs.step}}<\u002Fspan>\n            <span class=\"chip c-ai\">AI {{cs.ver}}<\u002Fspan>\n            <span class=\"chip {{cs.statusCls}}\">{{cs.status}}<\u002Fspan>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{cs.quarantined}}\"><div class=\"banner badb\"><b>Quarantined, not screened.<\u002Fb> The file declares {{cs.declared}} hits but contains {{cs.rowCount}} rows for this alert. It is held until NICE re-sends a complete alert. Nothing is overwritten.<\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{cs.repeat}}\"><div class=\"banner warnb\"><b>Repeat customer.<\u002Fb> {{cs.repeatText}} Earlier decisions are context only and never close this alert automatically.<\u002Fdiv><\u002Fsc-if>\n\n          <div class=\"tabs\" role=\"tablist\">\n            <sc-for list=\"{{cs.tabs}}\" as=\"t\" hint-placeholder-count=\"5\">\n              <button class=\"tabb {{t.cls}}\" role=\"tab\" sc-camel-on-click=\"{{t.pick}}\">{{t.label}}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <!-- overview -->\n          <sc-if value=\"{{cs.tOverview}}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"cols\">\n              <div class=\"card pad\" style=\"flex: 1 1 340px; min-width: 0\"><h2>Alert details<\u002Fh2>\n                <sc-for list=\"{{cs.alertRows}}\" as=\"r\" hint-placeholder-count=\"6\"><div class=\"kv\"><span class=\"sub\">{{r.k}}<\u002Fspan><span>{{r.v}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n              <div class=\"card pad\" style=\"flex: 1 1 340px; min-width: 0\"><h2>Customer record<\u002Fh2>\n                <sc-for list=\"{{cs.custRows}}\" as=\"r\" hint-placeholder-count=\"6\"><div class=\"kv\"><span class=\"sub\">{{r.k}}<\u002Fspan><span>{{r.v}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n                <p class=\"sub\" style=\"margin-top: 8px\">Document numbers are masked on screen and never sent to the AI.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"card scroll\">\n              <div class=\"pad\"><h2>Hits in this alert ({{cs.hitCount}})<\u002Fh2><p class=\"sub\">One alert, one decision. Review every hit, then decide for the whole alert.<\u002Fp><\u002Fdiv>\n              <div class=\"tbl h\" style=\"grid-template-columns: 1.4fr 1.3fr .6fr 1.3fr 1.4fr; min-width: 700px\"><span>Watchlist entry<\u002Fspan><span>Category<\u002Fspan><span>Score<\u002Fspan><span>Band<\u002Fspan><span>AI recommends<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{cs.hitSummary}}\" as=\"h\" hint-placeholder-count=\"3\">\n                <div class=\"tbl\" style=\"grid-template-columns: 1.4fr 1.3fr .6fr 1.3fr 1.4fr; min-width: 700px\">\n                  <span><b>{{h.name}}<\u002Fb><br><span class=\"sub mono\">{{h.key}}<\u002Fspan><\u002Fspan><span>{{h.listName}}<\u002Fspan><span><b>{{h.score}}<\u002Fb><\u002Fspan>\n                  <span><span class=\"chip {{h.bandCls}}\">{{h.bandLabel}}<\u002Fspan><\u002Fspan><span>{{h.rec}}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{cs.hasOthers}}\">\n              <div class=\"card pad\"><h2>Other alerts for this customer<\u002Fh2>\n                <sc-for list=\"{{cs.others}}\" as=\"o\" hint-placeholder-count=\"2\">\n                  <p style=\"margin-top: 8px\"><button class=\"link\" sc-camel-on-click=\"{{o.open}}\">{{o.id}}<\u002Fbutton> <span class=\"chip {{o.statusCls}}\">{{o.status}}<\u002Fspan> <span class=\"sub\">{{o.note}}<\u002Fspan><\u002Fp>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n\n          <!-- watchlist hits -->\n          <sc-if value=\"{{cs.tHits}}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-for list=\"{{cs.hits}}\" as=\"h\" hint-placeholder-count=\"2\">\n              <div class=\"card\">\n                <div class=\"pad\" style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px\">\n                  <div><h2>{{h.name}}<\u002Fh2><p class=\"sub mono\">{{h.key}} · {{h.listName}}<\u002Fp>\n                    <span style=\"display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px\">\n                      <sc-if value=\"{{h.repeat}}\"><span class=\"chip c-warn\">Repeat pair<\u002Fspan><\u002Fsc-if>\n                      <sc-if value=\"{{h.dead}}\"><span class=\"chip c-mute\">Deceased<\u002Fspan><\u002Fsc-if>\n                      <sc-if value=\"{{h.edited}}\"><span class=\"chip c-an\">Analyst edited {{h.editCount}}<\u002Fspan><\u002Fsc-if>\n                    <\u002Fspan><\u002Fdiv>\n                  <div style=\"text-align: right\"><b style=\"font-size: 22px\">{{h.score}}<\u002Fb><br><span class=\"chip {{h.bandCls}}\">{{h.bandLabel}}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{h.hasInfo}}\"><div class=\"pad sub\" style=\"border-top: 1px solid var(--line)\">Dow Jones note: {{h.infoText}}<\u002Fdiv><\u002Fsc-if>\n                <div class=\"scroll\">\n                  <div class=\"rowf h\"><span>Factor<\u002Fspan><span>Customer<\u002Fspan><span>Watchlist entry<\u002Fspan><span>Screening result<\u002Fspan><span>Analyst verdict<\u002Fspan><\u002Fdiv>\n                  <sc-for list=\"{{h.factors}}\" as=\"f\" hint-placeholder-count=\"8\">\n                    <div class=\"rowf\">\n                      <span><b>{{f.label}}<\u002Fb><br><span class=\"sub\">weight {{f.w}}<\u002Fspan><\u002Fspan>\n                      <span class=\"mono\">{{f.a}}<\u002Fspan><span class=\"mono\">{{f.b}}<\u002Fspan>\n                      <span><span class=\"chip {{f.cls}}\">{{f.res}}<\u002Fspan><\u002Fspan>\n                      <span>\n                        <sc-if value=\"{{f.editable}}\">\n                          <sc-raw-select class=\"sel\" value=\"{{f.verdict}}\" sc-camel-on-change=\"{{f.onChange}}\" disabled=\"{{f.locked}}\" aria-label=\"Verdict for {{f.label}}\">\n                            <option value=\"Match\">Match<\u002Foption><option value=\"Mismatch\">Mismatch<\u002Foption><option value=\"Inconclusive\">Inconclusive<\u002Foption>\n                          <\u002Fsc-raw-select>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{f.notEditable}}\"><span class=\"sub\">Not applicable<\u002Fspan><\u002Fsc-if>\n                      <\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div class=\"pad ancard\" style=\"margin: 12px; border-radius: 10px\">\n                  <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between\"><span class=\"chip c-an\">Analyst · suggested wording<\u002Fspan><button class=\"btn sm\" sc-camel-on-click=\"{{h.fillAi}}\" disabled=\"{{h.locked}}\">Start from AI summary<\u002Fbutton><\u002Fdiv>\n                  <textarea class=\"ta\" style=\"margin-top: 8px\" placeholder=\"Explain in your own words why this hit is or is not the customer\" value=\"{{h.wording}}\" sc-camel-on-change=\"{{h.onWording}}\" disabled=\"{{h.locked}}\" aria-label=\"Analyst wording for {{h.name}}\"><\u002Ftextarea>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n\n          <!-- adverse media -->\n          <sc-if value=\"{{cs.tMedia}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"banner infob\">Mock articles for the prototype. In the build, media comes from the indexed source and each result stores its exact URL and retrieval time. Retrieved text is treated as untrusted.<\u002Fdiv>\n            <sc-for list=\"{{cs.media}}\" as=\"m\" hint-placeholder-count=\"2\">\n              <div class=\"card pad\">\n                <h2>{{m.name}} <span class=\"sub mono\">{{m.key}}<\u002Fspan><\u002Fh2>\n                <sc-if value=\"{{m.empty}}\"><p class=\"sub\" style=\"margin-top: 8px\">No relevant adverse media found for this entry.<\u002Fp><\u002Fsc-if>\n                <sc-for list=\"{{m.items}}\" as=\"i\" hint-placeholder-count=\"2\">\n                  <div style=\"margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line)\">\n                    <b>{{i.title}}<\u002Fb> <span class=\"chip {{i.cls}}\">{{i.tone}}<\u002Fspan>\n                    <p class=\"sub\">{{i.source}} · {{i.date}}<\u002Fp>\n                    <p>{{i.snippet}}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n\n          <!-- AI assessment -->\n          <sc-if value=\"{{cs.tAi}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"aicard pad\" style=\"display: flex; flex-direction: column; gap: 10px\">\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">\n                <h2>AI assessment<\u002Fh2><span class=\"chip c-ai\">AI · recommendation only<\u002Fspan><span class=\"grow\"><\u002Fspan>\n                <sc-for list=\"{{cs.versions}}\" as=\"v\" hint-placeholder-count=\"2\"><button class=\"tab {{v.cls}}\" sc-camel-on-click=\"{{v.pick}}\">{{v.label}}<\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{cs.hasAi}}\">\n                <div class=\"cols\" style=\"gap: 12px\">\n                  <div style=\"flex: 1 1 280px\"><span class=\"sub\">Recommends for the alert<\u002Fspan><br><b style=\"font-size: 17px\">{{cs.cur.rec}}<\u002Fb>\n                    <p class=\"sub mono\">{{cs.cur.pocRec}} · confidence {{cs.cur.conf}}<\u002Fp><\u002Fdiv>\n                  <div style=\"flex: 1 1 280px\" class=\"sub mono\">Run at {{cs.cur.at}}<br>Trigger: {{cs.cur.trigger}}<br>Policy {{cs.cur.policy}} · prompt {{cs.cur.prompt}} · {{cs.cur.model}}<br>{{cs.cur.tokens}}<\u002Fdiv>\n                <\u002Fdiv>\n                <p>{{cs.cur.summary}}<\u002Fp>\n              <\u002Fsc-if>\n              <sc-if value=\"{{cs.noAi}}\"><p>{{cs.noAiText}}<\u002Fp><\u002Fsc-if>\n              <sc-if value=\"{{cs.rr.loading}}\"><div style=\"display: flex; gap: 12px; align-items: center\"><div class=\"spin\" role=\"status\" aria-label=\"Loading\"><\u002Fdiv><span>Re-running assessment (simulated)<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{cs.rr.show}}\">\n                <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-top: 1px solid #c7d2fe; padding-top: 10px\">\n                  <button class=\"btn\" sc-camel-on-click=\"{{cs.rr.run}}\" disabled=\"{{cs.rr.off}}\">Re-run assessment<\u002Fbutton>\n                  <span class=\"sub\">{{cs.rr.why}}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-for list=\"{{cs.aiHits}}\" as=\"x\" hint-placeholder-count=\"2\">\n              <div class=\"aicard pad\" style=\"display: flex; flex-direction: column; gap: 6px\">\n                <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px\"><h2>{{x.name}} <span class=\"sub mono\">{{x.key}}<\u002Fspan><\u002Fh2><span><b>AI score {{x.aiScore}}<\u002Fb> <span class=\"chip c-ai\">{{x.rec}}<\u002Fspan><\u002Fspan><\u002Fdiv>\n                <p>{{x.summary}}<\u002Fp>\n                <div class=\"cols\" style=\"gap: 16px\">\n                  <div style=\"flex: 1 1 260px\"><h3>Supporting evidence<\u002Fh3>\n                    <sc-for list=\"{{x.supp}}\" as=\"s\" hint-placeholder-count=\"2\"><p class=\"sub\">+ {{s.t}}<\u002Fp><\u002Fsc-for>\n                    <sc-if value=\"{{x.noSupp}}\"><p class=\"sub\">None found.<\u002Fp><\u002Fsc-if><\u002Fdiv>\n                  <div style=\"flex: 1 1 260px\"><h3>Contradicting evidence<\u002Fh3>\n                    <sc-for list=\"{{x.contra}}\" as=\"s\" hint-placeholder-count=\"2\"><p class=\"sub\">- {{s.t}}<\u002Fp><\u002Fsc-for>\n                    <sc-if value=\"{{x.noContra}}\"><p class=\"sub\">None found.<\u002Fp><\u002Fsc-if><\u002Fdiv>\n                <\u002Fdiv>\n                <p class=\"sub mono\">{{x.tokens}}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n\n          <!-- history -->\n          <sc-if value=\"{{cs.tHistory}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card scroll\">\n              <div class=\"pad\"><h2>Assessment versions<\u002Fh2><p class=\"sub\">Earlier versions are kept and read-only. A rerun adds a new version.<\u002Fp><\u002Fdiv>\n              <div class=\"tbl h\" style=\"grid-template-columns: .5fr 1.2fr 1.4fr 1.5fr 1.2fr 1fr; min-width: 760px\"><span>Version<\u002Fspan><span>When<\u002Fspan><span>Trigger<\u002Fspan><span>AI recommends<\u002Fspan><span>Policy and prompt<\u002Fspan><span>Tokens<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{cs.vrows}}\" as=\"v\" hint-placeholder-count=\"2\">\n                <div class=\"tbl\" style=\"grid-template-columns: .5fr 1.2fr 1.4fr 1.5fr 1.2fr 1fr; min-width: 760px\"><span><b>{{v.v}}<\u002Fb> <span class=\"chip {{v.cls}}\">{{v.tag}}<\u002Fspan><\u002Fspan><span class=\"mono\">{{v.at}}<\u002Fspan><span>{{v.trigger}}<\u002Fspan><span>{{v.rec}}<\u002Fspan><span class=\"mono\">{{v.policy}}<\u002Fspan><span class=\"mono\">{{v.tokens}}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div class=\"card pad\">\n              <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px\"><h2>Case history<\u002Fh2><button class=\"btn sm\" sc-camel-on-click=\"{{cs.openAudit}}\">Open full audit record<\u002Fbutton><\u002Fdiv>\n              <sc-for list=\"{{cs.events}}\" as=\"e\" hint-placeholder-count=\"4\">\n                <p style=\"margin-top: 8px\"><span class=\"sub mono\">{{e.t}} · {{e.who}}<\u002Fspan><br>{{e.what}}<\u002Fp>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- decision dock -->\n          <sc-if value=\"{{cs.dkDecide}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"ancard pad dock\" style=\"display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -6px 16px rgba(15,23,42,.08)\">\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\"><span class=\"chip c-an\">Analyst · final decision<\u002Fspan><b>One decision for the whole alert ({{cs.hitCount}} hits)<\u002Fb><span class=\"sub\">{{cs.editSummary}}<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n                <sc-for list=\"{{cs.pills}}\" as=\"d\" hint-placeholder-count=\"3\"><button class=\"pill {{d.cls}}\" sc-camel-on-click=\"{{d.pick}}\">{{d.label}}<\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{cs.isRfi}}\">\n                <div><h3>What is missing?<\u002Fh3>\n                  <sc-for list=\"{{cs.rfiItems}}\" as=\"i\" hint-placeholder-count=\"4\">\n                    <label class=\"check\"><input type=\"checkbox\" checked=\"{{i.checked}}\" sc-camel-on-change=\"{{i.toggle}}\"><span>{{i.label}}<\u002Fspan><\u002Flabel>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div class=\"fld\"><label for=\"rat\">Rationale (required)<\u002Flabel>\n                <textarea id=\"rat\" class=\"ta\" placeholder=\"Why this decision. This is stored in the audit record.\" value=\"{{cs.reason}}\" sc-camel-on-change=\"{{cs.onReason}}\"><\u002Ftextarea><\u002Fdiv>\n              <sc-if value=\"{{cs.err}}\"><p class=\"err\">{{cs.err}}<\u002Fp><\u002Fsc-if>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">\n                <button class=\"btn pri\" sc-camel-on-click=\"{{cs.submit}}\">Review and submit<\u002Fbutton>\n                <button class=\"btn\" sc-camel-on-click=\"{{cs.useWording}}\">Use my hit wording<\u002Fbutton>\n                <sc-if value=\"{{cs.canEsc}}\"><button class=\"btn\" sc-camel-on-click=\"{{cs.escalate}}\">Escalate to {{cs.escTo}}<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{cs.dkBlocked}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"ancard pad dock\"><span class=\"chip c-mute\">Decision not available<\u002Fspan> <span>{{cs.blockedMsg}}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{cs.dkPending}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"ancard pad dock\" style=\"display: flex; flex-direction: column; gap: 10px\">\n              <div><span class=\"chip c-warn\">Required Further Information<\u002Fspan> <b>Waiting for information<\u002Fb><\u002Fdiv>\n              <p>Missing: {{cs.rfiList}}. Raised by {{cs.rfiBy}} on {{cs.rfiAt}}.<\u002Fp>\n              <p class=\"sub\">Rationale: {{cs.rfiReason}}<\u002Fp>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">\n                <button class=\"btn pri\" sc-camel-on-click=\"{{cs.infoReceived}}\" disabled=\"{{cs.infoOff}}\">Mark information received<\u002Fbutton>\n                <span class=\"sub\">{{cs.infoWhy}}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{cs.dkClosed}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"ancard pad dock\" style=\"display: flex; flex-direction: column; gap: 6px\">\n              <div><span class=\"chip c-an\">Analyst · final decision<\u002Fspan> <b>{{cs.decision}}<\u002Fb><\u002Fdiv>\n              <p class=\"sub\">Decided by {{cs.decBy}} ({{cs.decRole}}) on {{cs.decAt}}<\u002Fp>\n              <p>{{cs.decReason}}<\u002Fp>\n              <p class=\"sub mono\">Disposition: {{cs.dispo}}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <!-- ================= TOKENS ================= -->\n        <sc-if value=\"{{ui.isTokens}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n            <div><h1>AI token usage · {{ui.cname}}<\u002Fh1><p class=\"sub\">Monthly period {{tk.period}}. Every AI call is metered here. Screening scores work without the AI.<\u002Fp><\u002Fdiv>\n            <span class=\"grow\"><\u002Fspan><span class=\"chip c-info\">Internal application quota, not Azure billing<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"stats\">\n            <sc-for list=\"{{tk.stats}}\" as=\"b\" hint-placeholder-count=\"6\">\n              <div class=\"card pad stat\"><div class=\"sub\">{{b.label}}<\u002Fdiv><div class=\"n\">{{b.value}}<\u002Fdiv><div class=\"sub\">{{b.note}}<\u002Fdiv><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div class=\"card pad\">\n            <div style=\"display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px\"><b>{{ui.meter.label}}<\u002Fb><span class=\"sub\">Warning at 80%. AI pauses at 100% of the token allowance or the monthly budget.<\u002Fspan><\u002Fdiv>\n            <div class=\"bar\" style=\"height: 12px; margin-top: 8px; position: relative\"><div class=\"fill {{ui.meter.cls}}\" style=\"width: {{ui.meter.w}}\"><\u002Fdiv><div style=\"position: absolute; left: 80%; top: 0; width: 2px; height: 100%; background: #0f172a\"><\u002Fdiv><\u002Fdiv>\n            <sc-if value=\"{{tk.exhausted}}\"><div class=\"banner badb\" style=\"margin-top: 12px\"><b>AI paused.<\u002Fb> New alerts open with their screening score and \"AI pending\". Reruns are blocked until a top-up is approved.<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{tk.warn}}\"><div class=\"banner warnb\" style=\"margin-top: 12px\"><b>80% reached.<\u002Fb> The Country Owner is notified.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div class=\"cols\">\n            <div class=\"card pad\" style=\"flex: 2 1 480px; min-width: 0\">\n              <h2>Daily usage<\u002Fh2><p class=\"sub\">Input tokens (dark) and output tokens (amber) per day, from the ledger.<\u002Fp>\n              <div class=\"bars\">\n                <sc-for list=\"{{tk.days}}\" as=\"d\" hint-placeholder-count=\"10\">\n                  <div class=\"barcol\" title=\"{{d.tip}}\"><div class=\"stack\" style=\"height: {{d.h}}\"><div style=\"height: {{d.hOut}}; background: #b45309\"><\u002Fdiv><div style=\"height: {{d.hIn}}; background: #0f766e\"><\u002Fdiv><\u002Fdiv><span class=\"sub\" style=\"font-size: 11px\">{{d.label}}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"card pad\" style=\"flex: 1 1 280px; min-width: 0\">\n              <h2>Input and output<\u002Fh2>\n              <sc-for list=\"{{tk.split}}\" as=\"s\" hint-placeholder-count=\"2\"><div class=\"kv\" style=\"grid-template-columns: 1fr auto\"><span>{{s.k}}<\u002Fspan><span class=\"mono\">{{s.v}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n              <p class=\"sub\" style=\"margin-top: 8px\">Cost estimate uses the list price per million tokens for the model in use.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"cols\">\n            <div class=\"card scroll\" style=\"flex: 1 1 380px; min-width: 0\">\n              <div class=\"pad\"><h2>By operation<\u002Fh2><\u002Fdiv>\n              <div class=\"tbl h\" style=\"grid-template-columns: 1.4fr .6fr 1fr .8fr; min-width: 420px\"><span>Operation<\u002Fspan><span>Runs<\u002Fspan><span>Tokens<\u002Fspan><span>USD<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{tk.byOp}}\" as=\"r\" hint-placeholder-count=\"3\"><div class=\"tbl\" style=\"grid-template-columns: 1.4fr .6fr 1fr .8fr; min-width: 420px\"><span>{{r.k}}<\u002Fspan><span>{{r.runs}}<\u002Fspan><span class=\"mono\">{{r.tokens}}<\u002Fspan><span class=\"mono\">{{r.usd}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <div class=\"card scroll\" style=\"flex: 1 1 380px; min-width: 0\">\n              <div class=\"pad\"><h2>Triggered by<\u002Fh2><\u002Fdiv>\n              <div class=\"tbl h\" style=\"grid-template-columns: 1.6fr .6fr 1fr; min-width: 380px\"><span>User or system<\u002Fspan><span>Runs<\u002Fspan><span>Tokens<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{tk.byWho}}\" as=\"r\" hint-placeholder-count=\"3\"><div class=\"tbl\" style=\"grid-template-columns: 1.6fr .6fr 1fr; min-width: 380px\"><span>{{r.k}}<\u002Fspan><span>{{r.runs}}<\u002Fspan><span class=\"mono\">{{r.tokens}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <div class=\"card scroll\" style=\"flex: 1 1 380px; min-width: 0\">\n              <div class=\"pad\"><h2>Top alerts by tokens<\u002Fh2><\u002Fdiv>\n              <div class=\"tbl h\" style=\"grid-template-columns: 1.3fr .6fr 1fr .8fr; min-width: 400px\"><span>Alert<\u002Fspan><span>Versions<\u002Fspan><span>Tokens<\u002Fspan><span>USD<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{tk.top}}\" as=\"r\" hint-placeholder-count=\"5\"><div class=\"tbl\" style=\"grid-template-columns: 1.3fr .6fr 1fr .8fr; min-width: 400px\"><span><button class=\"link\" sc-camel-on-click=\"{{r.open}}\">{{r.id}}<\u002Fbutton><\u002Fspan><span>{{r.versions}}<\u002Fspan><span class=\"mono\">{{r.tokens}}<\u002Fspan><span class=\"mono\">{{r.usd}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"cols\">\n            <div class=\"card pad\" style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n              <h2>Request a top-up<\u002Fh2>\n              <p class=\"sub\">{{tk.approveWho}}<\u002Fp>\n              <sc-if value=\"{{tk.canRequest}}\">\n                <div class=\"fld\"><label for=\"amt\">Extra tokens<\u002Flabel>\n                  <sc-raw-select id=\"amt\" class=\"sel\" value=\"{{tk.amount}}\" sc-camel-on-change=\"{{tk.onAmount}}\"><option value=\"50000\">50,000<\u002Foption><option value=\"100000\">100,000<\u002Foption><option value=\"250000\">250,000<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n                <div class=\"fld\"><label for=\"trs\">Reason (required)<\u002Flabel><input id=\"trs\" class=\"search\" type=\"text\" placeholder=\"Why more tokens are needed\" value=\"{{tk.reasonVal}}\" sc-camel-on-change=\"{{tk.onReason}}\"><\u002Fdiv>\n                <sc-if value=\"{{tk.err}}\"><p class=\"err\">{{tk.err}}<\u002Fp><\u002Fsc-if>\n                <button class=\"btn pri\" sc-camel-on-click=\"{{tk.request}}\">Submit request<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{tk.cannotRequest}}\"><p class=\"sub\">Your role cannot request top-ups. Ask a Team Leader or the Country Owner.<\u002Fp><\u002Fsc-if>\n              <sc-if value=\"{{tk.showSettings}}\">\n                <label class=\"check\" style=\"border-top: 1px solid var(--line); padding-top: 10px\"><input type=\"checkbox\" checked=\"{{tk.ownerApprove}}\" sc-camel-on-change=\"{{tk.toggleOwner}}\"><span>Country Owner may approve top-ups<\u002Fspan><\u002Flabel>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div class=\"card scroll\" style=\"flex: 2 1 480px; min-width: 0\">\n              <div class=\"pad\"><h2>Top-up history<\u002Fh2><\u002Fdiv>\n              <div class=\"tbl h\" style=\"grid-template-columns: .7fr 1fr 1fr .9fr 1.4fr 1.3fr; min-width: 720px\"><span>Request<\u002Fspan><span>When<\u002Fspan><span>By<\u002Fspan><span>Tokens<\u002Fspan><span>Reason<\u002Fspan><span>Status<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{tk.requests}}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div class=\"tbl\" style=\"grid-template-columns: .7fr 1fr 1fr .9fr 1.4fr 1.3fr; min-width: 720px\">\n                  <span class=\"mono\">{{r.id}}<\u002Fspan><span class=\"mono\">{{r.at}}<\u002Fspan><span>{{r.by}}<\u002Fspan><span class=\"mono\">{{r.amount}}<\u002Fspan><span>{{r.reason}}<\u002Fspan>\n                  <span><span class=\"chip {{r.cls}}\">{{r.status}}<\u002Fspan>\n                    <sc-if value=\"{{r.canAct}}\"><br><button class=\"btn sm\" sc-camel-on-click=\"{{r.approve}}\">Approve<\u002Fbutton> <button class=\"btn sm\" sc-camel-on-click=\"{{r.reject}}\">Reject<\u002Fbutton><\u002Fsc-if>\n                    <sc-if value=\"{{r.noAct}}\"><br><span class=\"sub\">{{r.note}}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"card scroll\">\n            <div class=\"pad\"><h2>Usage ledger<\u002Fh2><p class=\"sub\">Append-only. Each AI call is one line with the model, prompt version and the real input and output tokens.<\u002Fp><\u002Fdiv>\n            <div class=\"tbl h\" style=\"grid-template-columns: 1fr 1.3fr 1.2fr .5fr .9fr .7fr .7fr .8fr .7fr; min-width: 1000px\"><span>When<\u002Fspan><span>Type<\u002Fspan><span>Alert and hit<\u002Fspan><span>Ver<\u002Fspan><span>Model and prompt<\u002Fspan><span>In<\u002Fspan><span>Out<\u002Fspan><span>Total<\u002Fspan><span>USD<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{tk.ledger}}\" as=\"l\" hint-placeholder-count=\"6\">\n              <div class=\"tbl\" style=\"grid-template-columns: 1fr 1.3fr 1.2fr .5fr .9fr .7fr .7fr .8fr .7fr; min-width: 1000px\"><span class=\"mono\">{{l.t}}<\u002Fspan><span>{{l.type}}<\u002Fspan><span class=\"mono\">{{l.ref}}<\u002Fspan><span>{{l.ver}}<\u002Fspan><span class=\"mono\">{{l.model}}<\u002Fspan><span class=\"mono\">{{l.tin}}<\u002Fspan><span class=\"mono\">{{l.tout}}<\u002Fspan><span class=\"mono\">{{l.total}}<\u002Fspan><span class=\"mono\">{{l.usd}}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div class=\"card pad\"><h2>Demo controls<\u002Fh2><p class=\"sub\">Only in this prototype, so you can show the limits without waiting a month.<\u002Fp>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px\"><button class=\"btn\" sc-camel-on-click=\"{{tk.demoNear}}\">Jump to 98% used<\u002Fbutton><button class=\"btn\" sc-camel-on-click=\"{{tk.demoReset}}\">Reset demo adjustment<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ================= AUDIT ================= -->\n        <sc-if value=\"{{ui.isAudit}}\" hint-placeholder-val=\"{{ false }}\">\n          <div><h1>Audit trail<\u002Fh1><p class=\"sub\">{{ui.cname}} deployment. Every action is recorded with who, when, what and the evidence behind it. Open a row for the full record.<\u002Fp><\u002Fdiv>\n          <sc-if value=\"{{au.scoped}}\"><div class=\"banner infob\">Your role sees its own activity only.<\u002Fdiv><\u002Fsc-if>\n          <div class=\"toolbar\">\n            <label class=\"sub\" for=\"af\">From<\u002Flabel><input id=\"af\" class=\"search\" type=\"date\" value=\"{{au.from}}\" sc-camel-on-change=\"{{au.onFrom}}\">\n            <label class=\"sub\" for=\"at\">To<\u002Flabel><input id=\"at\" class=\"search\" type=\"date\" value=\"{{au.to}}\" sc-camel-on-change=\"{{au.onTo}}\">\n            <label class=\"sub\" for=\"au\">User<\u002Flabel>\n            <sc-raw-select id=\"au\" class=\"sel\" value=\"{{au.user}}\" sc-camel-on-change=\"{{au.onUser}}\"><option value=\"ALL\">All users<\u002Foption><option value=\"System\">System<\u002Foption><option value=\"Maly Chan\">Maly Chan<\u002Foption><option value=\"Vichet Ouk\">Vichet Ouk<\u002Foption><option value=\"Srey Nita\">Srey Nita<\u002Foption><option value=\"Rithy Chum\">Rithy Chum<\u002Foption><option value=\"Bopha Keo\">Bopha Keo<\u002Foption><option value=\"Kosal Meas\">Kosal Meas<\u002Foption><\u002Fsc-raw-select>\n            <label class=\"sub\" for=\"aa\">Action<\u002Flabel>\n            <sc-raw-select id=\"aa\" class=\"sel\" value=\"{{au.action}}\" sc-camel-on-change=\"{{au.onAction}}\"><option value=\"ALL\">All actions<\u002Foption><option value=\"AI_ASSESSED\">AI_ASSESSED<\u002Foption><option value=\"AI_RERUN\">AI_RERUN<\u002Foption><option value=\"ALERT_ASSIGNED\">ALERT_ASSIGNED<\u002Foption><option value=\"ALERT_CREATED\">ALERT_CREATED<\u002Foption><option value=\"ALERT_ESCALATED\">ALERT_ESCALATED<\u002Foption><option value=\"DECISION_SUBMITTED\">DECISION_SUBMITTED<\u002Foption><option value=\"DISPOSITION_QUEUED\">DISPOSITION_QUEUED<\u002Foption><option value=\"EVIDENCE_EXPORTED\">EVIDENCE_EXPORTED<\u002Foption><option value=\"FACTOR_VERDICT_EDITED\">FACTOR_VERDICT_EDITED<\u002Foption><option value=\"FILE_INGESTED\">FILE_INGESTED<\u002Foption><option value=\"INFO_RECEIVED\">INFO_RECEIVED<\u002Foption><option value=\"POLICY_PUBLISHED\">POLICY_PUBLISHED<\u002Foption><option value=\"REPORT_EXPORTED\">REPORT_EXPORTED<\u002Foption><option value=\"RERUN_REQUESTED\">RERUN_REQUESTED<\u002Foption><option value=\"RFI_RAISED\">RFI_RAISED<\u002Foption><option value=\"SETTING_CHANGED\">SETTING_CHANGED<\u002Foption><option value=\"SSO_LOGIN\">SSO_LOGIN<\u002Foption><option value=\"SSO_LOGOUT\">SSO_LOGOUT<\u002Foption><option value=\"TOPUP_APPROVED\">TOPUP_APPROVED<\u002Foption><option value=\"TOPUP_REJECTED\">TOPUP_REJECTED<\u002Foption><option value=\"TOPUP_REQUESTED\">TOPUP_REQUESTED<\u002Foption><option value=\"USER_CREATED\">USER_CREATED<\u002Foption><option value=\"USER_DISABLED\">USER_DISABLED<\u002Foption><option value=\"USER_ENABLED\">USER_ENABLED<\u002Foption><option value=\"USER_UPDATED\">USER_UPDATED<\u002Foption><\u002Fsc-raw-select>\n            <label class=\"sub\" for=\"ac\">Case<\u002Flabel><input id=\"ac\" class=\"search\" type=\"text\" placeholder=\"{{ui.casePh}}\" value=\"{{au.case}}\" sc-camel-on-change=\"{{au.onCase}}\">\n            <button class=\"btn sm\" sc-camel-on-click=\"{{au.clear}}\">Clear<\u002Fbutton>\n          <\u002Fdiv>\n          <p class=\"sub\">{{au.count}}<\u002Fp>\n          <div class=\"card scroll\">\n            <div class=\"tbl h\" style=\"grid-template-columns: .8fr 1.1fr 1.2fr 1.4fr 1.2fr 2.4fr .6fr; min-width: 980px\"><span>Event<\u002Fspan><span>When<\u002Fspan><span>User<\u002Fspan><span>Action<\u002Fspan><span>Case<\u002Fspan><span>Detail<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{au.empty}}\"><div class=\"pad\"><p><b>No audit events match<\u002Fb><\u002Fp><p class=\"sub\">Widen the dates or clear a filter.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{au.rows}}\" as=\"r\" hint-placeholder-count=\"8\">\n              <div class=\"tbl\" style=\"grid-template-columns: .8fr 1.1fr 1.2fr 1.4fr 1.2fr 2.4fr .6fr; min-width: 980px\">\n                <span class=\"mono\">{{r.id}}<\u002Fspan><span class=\"mono\">{{r.at}}<\u002Fspan><span>{{r.who}}<br><span class=\"sub\">{{r.role}}<\u002Fspan><\u002Fspan><span><span class=\"chip {{r.cls}}\">{{r.action}}<\u002Fspan><\u002Fspan><span class=\"mono\">{{r.entity}}<\u002Fspan><span>{{r.detail}}<\u002Fspan>\n                <span><button class=\"btn sm\" sc-camel-on-click=\"{{r.open}}\">Open<\u002Fbutton><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ================= REPORTS ================= -->\n        <sc-if value=\"{{ui.isReports}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\"><div><h1>Reports · screening outcomes<\u002Fh1><p class=\"sub\">{{ui.cname}} deployment. Figures come from the same alerts and decisions you see in the console.<\u002Fp><\u002Fdiv><span class=\"grow\"><\u002Fspan><button class=\"btn pri\" sc-camel-on-click=\"{{rp.openExport}}\">Export report<\u002Fbutton><\u002Fdiv>\n          <div class=\"toolbar\">\n            <label class=\"sub\" for=\"rpp\">Period<\u002Flabel>\n            <sc-raw-select id=\"rpp\" class=\"sel\" value=\"{{rp.period}}\" sc-camel-on-change=\"{{rp.onPeriod}}\"><option value=\"OCT\">October 2026<\u002Foption><option value=\"L7\">Last 7 days<\u002Foption><option value=\"SEP\">September 2026<\u002Foption><\u002Fsc-raw-select>\n            <label class=\"sub\" for=\"rpc\">Category<\u002Flabel>\n            <sc-raw-select id=\"rpc\" class=\"sel\" value=\"{{rp.cat}}\" sc-camel-on-change=\"{{rp.onCat}}\"><option value=\"ALL\">All<\u002Foption><option value=\"SAN\">Sanctions<\u002Foption><option value=\"PEP\">PEP<\u002Foption><option value=\"SIP\">Special interest person<\u002Foption><option value=\"SIE\">Special interest entity<\u002Foption><\u002Fsc-raw-select>\n            <label class=\"sub\" for=\"rps\">Status<\u002Flabel>\n            <sc-raw-select id=\"rps\" class=\"sel\" value=\"{{rp.status}}\" sc-camel-on-change=\"{{rp.onStatus}}\"><option value=\"ALL\">All<\u002Foption><option value=\"Open\">Open (new or in review)<\u002Foption><option value=\"Pending information\">Pending information<\u002Foption><option value=\"False Positive\">Closed · False Positive<\u002Foption><option value=\"Potential True Positive\">Closed · Potential True Positive<\u002Foption><\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <sc-if value=\"{{rp.loading}}\"><div class=\"card pad\" style=\"display: flex; gap: 12px; align-items: center\"><div class=\"spin\" role=\"status\" aria-label=\"Loading\"><\u002Fdiv><span class=\"sub\">Loading report<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n          <div class=\"stats\">\n            <sc-for list=\"{{rp.stats}}\" as=\"st\" hint-placeholder-count=\"4\"><div class=\"card pad stat\"><div class=\"sub\">{{st.label}}<\u002Fdiv><div class=\"n\">{{st.value}}<\u002Fdiv><div class=\"sub\">{{st.note}}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n          <div class=\"card pad\"><h2>Outcome mix<\u002Fh2>\n            <sc-for list=\"{{rp.bars}}\" as=\"b\" hint-placeholder-count=\"4\">\n              <div style=\"display: grid; grid-template-columns: 190px 1fr 40px; gap: 10px; align-items: center; margin-top: 8px\"><span>{{b.label}}<\u002Fspan><div class=\"bar\" style=\"height: 14px\"><div class=\"fill {{b.cls}}\" style=\"width: {{b.w}}\"><\u002Fdiv><\u002Fdiv><b>{{b.count}}<\u002Fb><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div class=\"card scroll\">\n            <div class=\"tbl h\" style=\"grid-template-columns: 1fr 1.5fr 1.4fr 1.5fr 1.2fr 1.1fr .8fr; min-width: 960px\"><span>Alert<\u002Fspan><span>Customer<\u002Fspan><span>Categories<\u002Fspan><span>Outcome<\u002Fspan><span>Decided by<\u002Fspan><span>Decided at<\u002Fspan><span>Tokens<\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{rp.empty}}\"><div class=\"pad\"><p><b>No alerts for this selection<\u002Fb><\u002Fp><p class=\"sub\">Try another period, category or status.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{rp.rows}}\" as=\"r\" hint-placeholder-count=\"6\">\n              <div class=\"tbl\" style=\"grid-template-columns: 1fr 1.5fr 1.4fr 1.5fr 1.2fr 1.1fr .8fr; min-width: 960px\"><span><button class=\"link\" sc-camel-on-click=\"{{r.open}}\">{{r.id}}<\u002Fbutton><\u002Fspan><span>{{r.cust}}<\u002Fspan><span>{{r.cats}}<\u002Fspan><span><span class=\"chip {{r.cls}}\">{{r.outcome}}<\u002Fspan><\u002Fspan><span>{{r.by}}<\u002Fspan><span class=\"mono\">{{r.at}}<\u002Fspan><span class=\"mono\">{{r.tokens}}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ================= USERS ================= -->\n        <sc-if value=\"{{ui.isUsers}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\"><div><h1>Users and roles<\u002Fh1><p class=\"sub\">{{ui.cname}} deployment. Accounts come from Okta. Here you control the role and whether the account may use this console.<\u002Fp><\u002Fdiv><span class=\"grow\"><\u002Fspan><button class=\"btn pri\" sc-camel-on-click=\"{{us.add}}\">Add user<\u002Fbutton><\u002Fdiv>\n          <div class=\"banner infob\">{{us.note}}<\u002Fdiv>\n          <div class=\"card scroll\">\n            <div class=\"tbl h\" style=\"grid-template-columns: 1.4fr 1.8fr 1.3fr .9fr 1.1fr 1.4fr; min-width: 900px\"><span>Name<\u002Fspan><span>Okta account<\u002Fspan><span>Role<\u002Fspan><span>Status<\u002Fspan><span>Last sign-in<\u002Fspan><span>Actions<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{us.rows}}\" as=\"u\" hint-placeholder-count=\"7\">\n              <div class=\"tbl\" style=\"grid-template-columns: 1.4fr 1.8fr 1.3fr .9fr 1.1fr 1.4fr; min-width: 900px\">\n                <span><b>{{u.name}}<\u002Fb><br><span class=\"sub\">Country: {{ui.cname}}<\u002Fspan><\u002Fspan><span class=\"mono\">{{u.email}}<\u002Fspan><span><span class=\"chip {{u.roleCls}}\">{{u.role}}<\u002Fspan><\u002Fspan><span><span class=\"chip {{u.statusCls}}\">{{u.status}}<\u002Fspan><\u002Fspan><span class=\"mono\">{{u.last}}<\u002Fspan>\n                <span><button class=\"btn sm\" sc-camel-on-click=\"{{u.edit}}\" disabled=\"{{u.off}}\">Edit<\u002Fbutton> <button class=\"btn sm\" sc-camel-on-click=\"{{u.toggle}}\" disabled=\"{{u.off}}\">{{u.toggleLabel}}<\u002Fbutton><sc-if value=\"{{u.offNote}}\"><br><span class=\"sub\">{{u.offNote}}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ================= POLICY ================= -->\n        <sc-if value=\"{{ui.isPolicy}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n            <div><h1>Screening policy · {{ui.cname}}<\u002Fh1><p class=\"sub\">Factors, weights, thresholds and routing. Active version {{po.tag}}. Document rule: {{ui.idRule}}.<\u002Fp><\u002Fdiv>\n            <span class=\"grow\"><\u002Fspan>\n            <sc-if value=\"{{po.dirty}}\"><span class=\"chip c-warn\">Unpublished changes<\u002Fspan><\u002Fsc-if>\n            <button class=\"btn\" sc-camel-on-click=\"{{po.discard}}\" disabled=\"{{po.clean}}\">Discard<\u002Fbutton>\n            <button class=\"btn pri\" sc-camel-on-click=\"{{po.publish}}\" disabled=\"{{po.clean}}\">Publish {{po.nextTag}}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{po.ro}}\"><div class=\"banner infob\">Read only. Policy changes are made by the Country Owner or a Super Admin.<\u002Fdiv><\u002Fsc-if>\n          <div class=\"cols\">\n            <div style=\"flex: 1 1 460px; display: flex; flex-direction: column; gap: 16px; min-width: 0\">\n              <div class=\"card pad\"><h2>Factors and weights<\u002Fh2><p class=\"sub\">Weights are normalised. Set 0 to switch a factor off. Total now {{po.total}}.<\u002Fp>\n                <sc-for list=\"{{po.factorRows}}\" as=\"f\" hint-placeholder-count=\"8\">\n                  <div class=\"row2\"><div><b>{{f.label}}<\u002Fb><br><span class=\"sub\">{{f.help}}<\u002Fspan><\u002Fdiv>\n                    <input type=\"range\" min=\"0\" max=\"40\" step=\"1\" value=\"{{f.value}}\" sc-camel-on-change=\"{{f.onChange}}\" disabled=\"{{po.ro}}\" aria-label=\"{{f.label}} weight\">\n                    <span style=\"text-align: right\"><b>{{f.value}}<\u002Fb><br><span class=\"sub\">{{f.share}}<\u002Fspan><\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div class=\"card pad\"><h2>Bands and decision rules<\u002Fh2><p class=\"sub\">A score at or above a threshold falls in that band. The band decides which step reviews the alert.<\u002Fp>\n                <sc-for list=\"{{po.bandRows}}\" as=\"b\" hint-placeholder-count=\"4\">\n                  <div class=\"row2\" style=\"grid-template-columns: minmax(150px,1.3fr) 2fr .8fr .8fr\"><div><span class=\"chip {{b.cls}}\">{{b.label}}<\u002Fspan><\u002Fdiv>\n                    <input type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"{{b.value}}\" sc-camel-on-change=\"{{b.onChange}}\" disabled=\"{{b.off}}\" aria-label=\"{{b.label}} threshold\"><span><b>{{b.valueText}}<\u002Fb><\u002Fspan>\n                    <sc-raw-select class=\"sel\" value=\"{{b.route}}\" sc-camel-on-change=\"{{b.onRoute}}\" disabled=\"{{po.ro}}\" aria-label=\"{{b.label}} step\"><option value=\"L1 Review\">L1<\u002Foption><option value=\"L2 Review\">L2<\u002Foption><option value=\"L3 Review\">L3<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 1 1 320px; display: flex; flex-direction: column; gap: 16px; min-width: 0\">\n              <div class=\"card pad\"><h2>Preview on the sample file<\u002Fh2><p class=\"sub\">What these settings do to the {{po.alertCount}} screened sample alerts, before publishing.<\u002Fp>\n                <div class=\"tbl h\" style=\"grid-template-columns: 1.6fr .8fr .8fr .8fr; padding-left: 0; padding-right: 0\"><span>Top band<\u002Fspan><span>Active<\u002Fspan><span>Draft<\u002Fspan><span>Change<\u002Fspan><\u002Fdiv>\n                <sc-for list=\"{{po.previewRows}}\" as=\"p\" hint-placeholder-count=\"4\"><div class=\"tbl\" style=\"grid-template-columns: 1.6fr .8fr .8fr .8fr; padding-left: 0; padding-right: 0\"><span><span class=\"chip {{p.cls}}\">{{p.label}}<\u002Fspan><\u002Fspan><span>{{p.active}}<\u002Fspan><span>{{p.draft}}<\u002Fspan><span><b>{{p.delta}}<\u002Fb><\u002Fspan><\u002Fdiv><\u002Fsc-for>\n                <p style=\"margin-top: 10px\"><b>{{po.moved}}<\u002Fb> alerts would change band.<\u002Fp><\u002Fdiv>\n              <div class=\"card pad\"><h2>How changes are controlled<\u002Fh2>\n                <ul class=\"steps\" style=\"margin-top: 8px\">\n                  <li><span class=\"dot\">1<\u002Fspan><span>Edit and preview. Analysts see nothing yet.<\u002Fspan><\u002Fli>\n                  <li><span class=\"dot\">2<\u002Fspan><span>Publish creates a new version and an audit event.<\u002Fspan><\u002Fli>\n                  <li><span class=\"dot\">3<\u002Fspan><span>Each AI assessment stores the policy version it used.<\u002Fspan><\u002Fli>\n                <\u002Ful><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fmain>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- confirm decision -->\n  <sc-if value=\"{{md.isConfirm}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"overlay\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Confirm decision\">\n      <div class=\"modal\">\n        <h2>Confirm final decision<\u002Fh2>\n        <div class=\"ancard pad\" style=\"display: flex; flex-direction: column; gap: 6px\">\n          <div><span class=\"chip c-an\">Analyst · final decision<\u002Fspan> <span class=\"chip {{md.cf.cls}}\">{{md.cf.decision}}<\u002Fspan><\u002Fdiv>\n          <p>Applies to alert <b>{{md.cf.id}}<\u002Fb> and all {{md.cf.hits}} of its hits. {{md.cf.edits}}<\u002Fp>\n          <sc-if value=\"{{md.cf.hasRfi}}\"><p>Missing information: {{md.cf.rfiList}}<\u002Fp><\u002Fsc-if>\n          <p class=\"sub\">Rationale: {{md.cf.reason}}<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"aicard pad\"><span class=\"chip c-ai\">AI · recommendation only<\u002Fspan> <span>The AI recommended: <b>{{md.cf.aiRec}}<\u002Fb>. {{md.cf.agree}}<\u002Fspan><\u002Fdiv>\n        <sc-if value=\"{{md.cf.loading}}\"><div style=\"display: flex; gap: 12px; align-items: center\"><div class=\"spin\" role=\"status\" aria-label=\"Loading\"><\u002Fdiv><span>Saving decision and writing the audit record<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end\">\n          <button class=\"btn\" sc-camel-on-click=\"{{md.cf.cancel}}\" disabled=\"{{md.cf.loading}}\">Back<\u002Fbutton>\n          <button class=\"btn pri\" sc-camel-on-click=\"{{md.cf.confirm}}\" disabled=\"{{md.cf.loading}}\">Confirm decision<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- audit record -->\n  <sc-if value=\"{{md.isAudit}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"overlay\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Audit record\">\n      <div class=\"modal\" style=\"max-width: 980px\">\n        <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center\"><h2>Audit record {{md.ar.id}}<\u002Fh2><button class=\"btn sm\" sc-camel-on-click=\"{{md.ar.close}}\">Close<\u002Fbutton><\u002Fdiv>\n        <div class=\"card pad\">\n          <div class=\"kv\"><span class=\"sub\">When<\u002Fspan><span class=\"mono\">{{md.ar.at}}<\u002Fspan><\u002Fdiv>\n          <div class=\"kv\"><span class=\"sub\">User<\u002Fspan><span>{{md.ar.who}} ({{md.ar.role}})<\u002Fspan><\u002Fdiv>\n          <div class=\"kv\"><span class=\"sub\">Action<\u002Fspan><span><span class=\"chip {{md.ar.cls}}\">{{md.ar.action}}<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"kv\"><span class=\"sub\">Case<\u002Fspan><span class=\"mono\">{{md.ar.entity}}<\u002Fspan><\u002Fdiv>\n          <div class=\"kv\"><span class=\"sub\">Detail<\u002Fspan><span>{{md.ar.detail}}<\u002Fspan><\u002Fdiv>\n          <div class=\"kv\"><span class=\"sub\">Integrity hash<\u002Fspan><span class=\"mono\">{{md.ar.hash}}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{md.ar.hasAlert}}\">\n          <div class=\"card scroll\">\n            <div class=\"pad\"><h2>Assessment versions<\u002Fh2><p class=\"sub\">Every version is kept with the policy, prompt and model that produced it.<\u002Fp><\u002Fdiv>\n            <div class=\"tbl h\" style=\"grid-template-columns: .5fr 1.1fr 1.3fr 1.4fr 1.2fr 1fr; min-width: 760px\"><span>Ver<\u002Fspan><span>When<\u002Fspan><span>Trigger<\u002Fspan><span>AI recommends<\u002Fspan><span>Policy and prompt<\u002Fspan><span>Tokens<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{md.ar.vtable}}\" as=\"v\" hint-placeholder-count=\"2\"><div class=\"tbl\" style=\"grid-template-columns: .5fr 1.1fr 1.3fr 1.4fr 1.2fr 1fr; min-width: 760px\"><span><b>{{v.v}}<\u002Fb><\u002Fspan><span class=\"mono\">{{v.at}}<\u002Fspan><span>{{v.trigger}}<\u002Fspan><span>{{v.rec}}<\u002Fspan><span class=\"mono\">{{v.policy}}<\u002Fspan><span class=\"mono\">{{v.tokens}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n          <div class=\"card pad\">\n            <h2>Decision history<\u002Fh2>\n            <sc-for list=\"{{md.ar.decisions}}\" as=\"e\" hint-placeholder-count=\"3\"><p style=\"margin-top: 8px\"><span class=\"sub mono\">{{e.t}} · {{e.who}}<\u002Fspan><br>{{e.what}}<\u002Fp><\u002Fsc-for>\n            <sc-if value=\"{{md.ar.noDecisions}}\"><p class=\"sub\">No analyst decision recorded yet.<\u002Fp><\u002Fsc-if>\n          <\u002Fdiv>\n          <div class=\"card pad\" style=\"display: flex; flex-direction: column; gap: 8px\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\"><h2>Evidence package<\u002Fh2><span class=\"sub\">Same structure as the POC evidence record: factors, score breakdown, prompt sent, AI response, tokens, final decision.<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px\"><sc-for list=\"{{md.ar.verChips}}\" as=\"c\" hint-placeholder-count=\"2\"><button class=\"tab {{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\">{{c.label}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px\"><sc-for list=\"{{md.ar.hitChips}}\" as=\"c\" hint-placeholder-count=\"3\"><button class=\"tab {{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\">{{c.label}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n            <pre class=\"pre mono\">{{md.ar.json}}<\u002Fpre>\n            <div><button class=\"btn\" sc-camel-on-click=\"{{md.ar.exportEv}}\">Export evidence JSON<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- export -->\n  <sc-if value=\"{{md.isExport}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"overlay\" role=\"dialog\" aria-modal=\"true\" aria-l s: BI[b[0]][1], off: ro || !b[1], value: b[1] ? pol.th[b[1]] : 0, valueText: b[1] ? '≥ ' + pol.th[b[1]] : 'below ' + pol.th.review, route: pol.route[b[0]],\n      onChange: (e) => this.setPol('th', b[1], parseInt(e.target.value, 10)), onRoute: (e) => this.setPol('route', b[0], e.target.value)\n    }));\n    const screened = this.alerts().filter((a) => a.declared === a.hits.length);\n    const count = (p) => { const o = { HIGH: 0, POTENTIAL: 0, REVIEW: 0, LOW: 0 }; screened.forEach((a) => { const t = a.hits.reduce((m, h) => Math.max(m, this.compare(a, h, p).score), 0); o[this.bandOf(t, p.th)]++; }); return o; };\n    const cA = count(saved), cD = count(pol);\n    const keys = ['HIGH', 'POTENTIAL', 'REVIEW', 'LOW'];\n    return {\n      tag: this.cty().code + ' v' + s.polVer, nextTag: this.cty().code + ' v' + (s.polVer + 1), dirty: dirty, clean: !dirty || ro, ro: ro, total: total, alertCount: screened.length, factorRows: factorRows, bandRows: bandRows,\n      previewRows: keys.map((k) => ({ label: BI[k][0], cls: BI[k][1], active: cA[k], draft: cD[k], delta: (cD[k] - cA[k] > 0 ? '+' : '') + (cD[k] - cA[k]) })),\n      moved: keys.reduce((m, k) => m + Math.abs(cD[k] - cA[k]), 0) / 2, publish: () => this.publishPol(), discard: () => this.discardPol()\n    };\n  }\n\n  vModal(x) {\n    const s = x.s, m = s.modal, P = x.P, R = x.R;\n    const none = { cf: {}, ar: { vtable: [], decisions: [], verChips: [], hitChips: [] }, ex: {}, us: { roleOpts: [] } };\n    if (!m) return Object.assign({ isConfirm: false, isAudit: false, isExport: false, isUser: false }, none);\n    const out = Object.assign({ isConfirm: m.type === 'confirm', isAudit: m.type === 'audit', isExport: m.type === 'export', isUser: m.type === 'user' }, none);\n    if (m.type === 'confirm') {\n      const a = x.list.find((q) => q.id === m.id), A = a.A, d = s.draft, v = A.versions[A.versions.length - 1];\n      const names = { FP: 'False Positive', PTP: 'Potential True Positive', RFI: 'Required Further Information' };\n      const edits = Object.keys(A.ov).reduce((n, k) => n + Object.keys(A.ov[k]).length, 0);\n      out.cf = { id: a.id, decision: names[d.d], cls: d.d === 'FP' ? 'c-ok' : d.d === 'PTP' ? 'b-high' : 'c-warn', hits: a.hits.length, edits: edits ? edits + ' factor verdict' + (edits > 1 ? 's were' : ' was') + ' edited.' : 'No factor verdicts were edited.',\n        hasRfi: d.d === 'RFI', rfiList: d.rfi.join(', '), reason: d.reason, aiRec: v.rec, agree: v.rec === names[d.d] ? 'Your decision agrees with it.' : 'Your decision differs from it, which is allowed and is recorded.',\n        loading: !!m.loading, cancel: () => this.closeModal(), confirm: () => this.confirmDecision() };\n    }\n    if (m.type === 'audit') {\n      const ev = s.audit.find((e) => e.id === m.evId), a = x.list.find((q) => q.id === ev.entity);\n      out.ar = { id: ev.id, at: ev.at.replace('T', ' '), who: ev.who, role: ev.role, action: ev.action, cls: this.actionCls(ev.action), entity: ev.entity, detail: ev.detail, hash: 'sha256 (mock) ' + this.hash(JSON.stringify(ev)), hasAlert: !!a, close: () => this.closeModal(), vtable: [], decisions: [], noDecisions: false, verChips: [], hitChips: [], json: '' };\n      if (a && a.A.versions.length) {\n        const A = a.A, vn = m.ver || A.versions[A.versions.length - 1].n, v = A.versions.find((q) => q.n === vn);\n        out.ar.vtable = A.versions.map((q) => ({ v: 'v' + q.n, at: this.dl(q.at), trigger: q.trigger, rec: q.rec, policy: q.policy + ' · ' + q.prompt, tokens: this.fmt(q.tin + q.tout) }));\n        const rel = ['DECISION_SUBMITTED', 'RFI_RAISED', 'INFO_RECEIVED', 'ALERT_ESCALATED', 'FACTOR_VERDICT_EDITED', 'DISPOSITION_QUEUED', 'AI_RERUN', 'RERUN_REQUESTED', 'AI_ASSESSED', 'ALERT_ASSIGNED', 'EVIDENCE_EXPORTED'];\n        out.ar.decisions = s.audit.filter((e) => e.entity === a.id && rel.indexOf(e.action) >= 0).map((e) => ({ t: this.dl(e.at), who: e.who, what: e.action + ' · ' + e.detail }));\n        out.ar.noDecisions = !out.ar.decisions.some((e) => /DECISION|RFI/.test(e.what));\n        out.ar.verChips = A.versions.map((q) => ({ label: 'Version ' + q.n, cls: q.n === vn ? 'on' : '', pick: () => this.mutate((z) => { z.modal.ver = q.n; }) }));\n        out.ar.hitChips = v.hits.map((h, i) => ({ label: h.key, cls: i === m.hit ? 'on' : '', pick: () => this.mutate((z) => { z.modal.hit = i; }) }));\n        out.ar.json = this.evidenceJson(a, A, ev, vn, m.hit);\n        out.ar.exportEv = () => this.exportEvidence(a.id, ev.id);\n      }\n    }\n    if (m.type === 'export') {\n      const f = s.rpf, rows = this.reportRows(x);\n      const P1 = { OCT: 'October 2026', L7: 'Last 7 days', SEP: 'September 2026' }[f.period];\n      const summary = P1 + ', category ' + f.cat + ', status ' + f.status + ', ' + rows.length + ' alerts';\n      out.ex = { summary: 'Report: ' + summary + '.', format: m.format, onFormat: (e) => this.mutate((z) => { z.modal.format = e.target.value; }), pick: m.stage === 'pick', loading: m.stage === 'loading', done: m.stage === 'done', file: m.file,\n        confirm: () => this.confirmExport(summary), close: () => this.closeModal(), closeLabel: m.stage === 'done' ? 'Close' : 'Cancel' };\n    }\n    if (m.type === 'user') {\n      const opts = P.role === 'CO' ? ['L1', 'L2', 'L3'] : ['SA', 'CO', 'L1', 'L2', 'L3'];\n      out.us = { title: m.id ? 'Edit user' : 'Add user', name: m.form.name, email: m.form.email, role: m.form.role, emailLocked: !!m.id, err: m.err, roleOpts: opts.map((k) => ({ v: k, label: R[k][0] })),\n        onName: (e) => this.setUserField('name', e.target.value), onEmail: (e) => this.setUserField('email', e.target.value), onRole: (e) => this.setUserField('role', e.target.value), save: () => this.saveUser(), close: () => this.closeModal() };\n    }\n    return out;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
